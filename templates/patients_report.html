<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports Dashboard</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f7f9fc;
      color: #2c3e50;
    }

    .container {
      display: flex;
    }

    .sidebar {
      width: 220px;
      background-color: #34495e;
      padding: 20px;
      min-height: 100vh;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
    }

    .sidebar a {
      display: block;
      padding: 10px 15px;
      font-weight: bold;
      color: #ecf0f1;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background-color: #4ca1af;
      color: #fff;
    }

    .main {
      flex: 1;
      padding: 30px;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
      margin: 20px;
    }

    h1 {
      margin-top: 0;
      color: #34495e;
    }

    .section {
      margin-bottom: 30px;
    }

    .overview-container {
      display: flex;
      gap: 20px;
    }

    .chart-box, .stats-box {
      background-color: #f8f9fa;
      padding: 20px;
      flex: 1;
      border-radius: 8px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
    }

    .chart-placeholder {
      height: 180px;
      background: repeating-linear-gradient(
        45deg,
        #f0f0f0,
        #f0f0f0 10px,
        #e0e0e0 10px,
        #e0e0e0 20px
      );
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7f8c8d;
      font-style: italic;
      border-radius: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #4ca1af;
      color: white;
      font-weight: bold;
    }

    tr:nth-child(even) {
      background-color: #f8f9fa;
    }

    .export-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
    }

    .export-container textarea {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-right: 20px;
      background-color: #f8f9fa;
      color: #2c3e50;
      font-family: 'Segoe UI', sans-serif;
    }

    .export-container textarea::placeholder {
      font-style: italic;
      color: #7f8c8d;
    }

    .export-btn {
      background-color: #4ca1af;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .export-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <a href="/neurologist_dashboard">Dashboard</a>
      <a href="#">Cases</a>
      <a href="#" class="active">Reports</a>
    </div>

    <div class="main">
      <h1>REPORTS</h1>

      <div class="section overview-container">
        <div class="chart-box">
          <h3>OVERVIEW</h3>
          <div class="chart-placeholder">[Chart Visualization]</div>
        </div>
        <div class="stats-box">
          <h3>STATISTICS</h3>
          <p>• Total Patients: <strong>125</strong></p>
          <p>• Avg Treatment Time: <strong>32 mins</strong></p>
          <p>• Discharges: <strong>68%</strong></p>
        </div>
      </div>

      <div class="section">
        <h3>TRENDS</h3>
        <table>
          <thead>
            <tr>
              <th>Patient</th>
              <th>Measure</th>
              <th>Change</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Jane Doe</td><td>Blood Pressure</td><td>-10 mmHg</td></tr>
            <tr><td>John Smith</td><td>Heart Rate</td><td>-5 bpm</td></tr>
            <tr><td>Emily White</td><td>Oxygen Saturation</td><td>+3%</td></tr>
          </tbody>
        </table>
      </div>

      <div class="export-container">
        <textarea rows="4" placeholder="Write a summary or notes to export or print..."></textarea>
        <button class="export-btn">Export</button>
      </div>
    </div>
  </div>
</body>
</html>
