<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient List</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #2c3e50;
    }

    .patient-table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    .patient-table thead {
      background-color: #3498db;
      color: white;
    }

    .patient-table th, .patient-table td {
      padding: 16px 20px;
      text-align: left;
    }

    .patient-table tr {
      border-bottom: 1px solid #ecf0f1;
    }



    .badge {
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      color: white;
    }

    .stable {
      background-color: #2ecc71;
    }

    .critical {
      background-color: #e74c3c;
    }

    .actions button {
      padding: 8px 14px;
      margin-right: 8px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-view {
      background-color: #2ecc71;
      color: white;
    }

    .btn-view:hover {
      background-color: #27ae60;
    }

    .btn-edit {
      background-color: #f1c40f;
      color: white;
    }

    .btn-edit:hover {
      background-color: #d4ac0d;
    }

    .btn-delete {
      background-color: #e74c3c;
      color: white;
    }

    .btn-delete:hover {
      background-color: #c0392b;
    }

    @media (max-width: 768px) {
      .patient-table thead {
        display: none;
      }

      .patient-table, .patient-table tbody, .patient-table tr, .patient-table td {
        display: block;
        width: 100%;
      }

      .patient-table tr {
        margin-bottom: 15px;
        background: white;
        box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        border-radius: 8px;
        overflow: hidden;
      }

      .patient-table td {
        padding: 15px;
        text-align: right;
        position: relative;
      }

      .patient-table td::before {
        content: attr(data-label);
        position: absolute;
        left: 15px;
        font-weight: bold;
        text-transform: capitalize;
        color: #2c3e50;
      }
    }
  </style>
</head>
<body>

<h1>Patient List</h1>

<table class="patient-table">
  <thead>
    <tr>
      <th>Full Name</th>
      <th>Age</th>
      <th>Arrival Time</th>
      <th>Heart Rate</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for patient in patients%}
    <tr>
      <td data-label="Full Name">{{ patient.fullname }}</td>
      <td data-label="Age">{{ patient.age }}</td>
      <td data-label="Arrival Time">{{ patient.arrival }}</td>
      <td data-label="Heart Rate">{{ patient.heart_rate }} bpm</td>
      <td data-label="Status">
        {% if patient.status == 'Critical' %}
          <span class="badge critical">Critical</span>
        {% else %}
          <span class="badge stable">Stable</span>
        {% endif %}
      </td>
      <td class="actions">
        <button class="btn-view" onclick="window.location.href='/patients/{{ patient.id }}'">View</button>
        <button class="btn-edit" onclick="window.location.href='/patients/{{ patient.id }}/edit'">Edit</button>
        <button class="btn-delete" onclick="window.location.href='/patients/{{ patient.id }}/delete'">Delete</button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

</body>
</html>
