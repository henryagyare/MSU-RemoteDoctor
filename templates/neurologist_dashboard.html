<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neurologist Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: #f4f6f9;
    }
    .container {
      display: flex;
    }
    .sidebar {
      width: 220px;
      background-color: #e2e3e5;
      min-height: 100vh;
      padding: 20px;
      box-shadow: 2px 0 8px rgba(0,0,0,0.1);
    }
    .sidebar a {
      display: block;
      margin: 15px 0;
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }
    .main-content {
      flex: 1;
      padding: 30px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
    }
    .logout {
      text-decoration: none;
      color: #007bff;
      font-weight: bold;
    }
    .card-group {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }
    .card {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.1);
      flex: 1;
      text-align: center;
    }
    .card h2 {
      margin: 0 0 10px;
    }
    .section {
      margin-top: 30px;
    }
    .section-title {
      margin-bottom: 10px;
      font-weight: bold;
    }
    .flex-grid {
      display: flex;
      gap: 20px;
    }
    .table-container,
    .chart-container,
    .message-box {
      flex: 1;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.1);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #f1f1f1;
    }
    .message-box p {
      margin: 8px 0;
      border-bottom: 1px dashed #ccc;
      padding-bottom: 6px;
    }
    .chart-placeholder {
      width: 100%;
      height: 200px;
      background: repeating-linear-gradient(
        45deg,
        #f2f2f2,
        #f2f2f2 10px,
        #e0e0e0 10px,
        #e0e0e0 20px
      );
      display: flex;
      justify-content: center;
      align-items: center;
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <a href="#" class="active">Dashboard</a>
      <a href="#">Patients</a>
      <a href="#">Appointments</a>
      <a href="/patients_report">Reports</a>
    </div>
    <div class="main-content">
      <div class="header">
        <h1>NEUROLOGIST DASHBOARD</h1>
        <a href="#" class="logout">Logout</a>
      </div>

      <div class="card-group">
        <div class="card">
          <h2>NEW PATIENTS</h2>
          <p>0</p>
        </div>
        <div class="card">
          <h2>UPCOMING APPOINTMENTS</h2>
          <p>0</p>
        </div>
        <div class="card">
          <h2>ALERTS</h2>
          <p>0</p>
        </div>
      </div>

      <div class="section flex-grid">
        <div class="table-container">
          <div class="section-title">PATIENT LIST</div>
          <table>
            <thead>
              <tr>
                <th>Patient</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>—</td><td>—</td></tr>
              <tr><td>—</td><td>—</td></tr>
            </tbody>
          </table>
        </div>

        <div class="chart-container">
          <div class="section-title">APPOINTMENT SCHEDULE</div>
          <div class="chart-placeholder">[Chart Placeholder]</div>
        </div>
      </div>

      <div class="section flex-grid">
        <div class="message-box">
          <div class="section-title">MESSAGES</div>
          <p>No new messages</p>
        </div>
        <div class="message-box">
          <div class="section-title">MESSAGES</div>
          <p>No new messages</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
