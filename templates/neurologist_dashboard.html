<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neurologist Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #8e9eab, #eef2f3); /* Soft gray gradient */
      color: #333; /* Softer text color */
    }

    .container {
      display: flex;
    }

    .sidebar {
      width: 220px;
      background-color: #dfe6e9; /* Light gray */
      min-height: 100vh;
      padding: 20px;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
    }

    .sidebar a {
      display: block;
      margin: 15px 0;
      text-decoration: none;
      color: #2d3436; /* Darker text color */
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background-color: #74b9ff; /* Soft blue highlight */
      color: #fff;
    }

    .main-content {
      flex: 1;
      padding: 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      color: #2d3436; /* Darker text color */
    }

    .logout {
      text-decoration: none;
      color: #74b9ff; /* Soft blue */
      font-weight: bold;
      transition: color 0.3s ease;
    }

    .logout:hover {
      color: #0984e3; /* Slightly darker blue */
    }

    .card-group {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }

    .card {
      background-color: #ffffff; /* White card background */
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
      flex: 1;
      text-align: center;
      color: #2d3436;
    }

    .card h2 {
      margin: 0 0 10px;
      color: #74b9ff; /* Soft blue title */
    }

    .section {
      margin-top: 30px;
    }

    .section-title {
      margin-bottom: 10px;
      font-weight: bold;
      color: #2d3436;
    }

    .flex-grid {
      display: flex;
      gap: 20px;
    }

    .table-container,
    .chart-container,
    .message-box {
      flex: 1;
      background-color: #f5f5f5; /* Light gray background */
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
      color: #2d3436;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: #2d3436;
    }

    th, td {
      border: 1px solid #dfe6e9; /* Light border color */
      padding: 8px 12px;
      text-align: left;
    }

    th {
      background-color: #dfe6e9; /* Light gray header background */
    }

    .chart-placeholder {
      width: 100%;
      height: 200px;
      background: repeating-linear-gradient(
        45deg,
        #dfe6e9,
        #dfe6e9 10px,
        #f5f5f5 10px,
        #f5f5f5 20px
      );
      display: flex;
      justify-content: center;
      align-items: center;
      color: #b2bec3;
      font-style: italic;
    }

    .message-box p {
      margin: 8px 0;
      border-bottom: 1px dashed #dfe6e9;
      padding-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <a href="#" class="active">Dashboard</a>
      <a href="#">Patients</a>
      <a href="#">Appointments</a>
      <a href="/patients_report">Reports</a>
    </div>
    <div class="main-content">
      <div class="header">
        <h1>NEUROLOGIST DASHBOARD</h1>
        <a href="#" class="logout">Logout</a>
      </div>

      <div class="card-group">
        <div class="card">
          <h2>NEW PATIENTS</h2>
          <p>0</p>
        </div>
        <div class="card">
          <h2>UPCOMING APPOINTMENTS</h2>
          <p>0</p>
        </div>
        <div class="card">
          <h2>ALERTS</h2>
          <p>0</p>
        </div>
      </div>

      <div class="section flex-grid">
        <div class="table-container">
          <div class="section-title">PATIENT LIST</div>
          <table>
            <thead>
              <tr>
                <th>Patient</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>—</td><td>—</td></tr>
              <tr><td>—</td><td>—</td></tr>
            </tbody>
          </table>
        </div>

        <div class="chart-container">
          <div class="section-title">APPOINTMENT SCHEDULE</div>
          <div class="chart-placeholder">[Chart Placeholder]</div>
        </div>
      </div>

      <div class="section flex-grid">
        <div class="message-box">
          <div class="section-title">MESSAGES</div>
          <p>No new messages</p>
        </div>
        <div class="message-box">
          <div class="section-title">MESSAGES</div>
          <p>No new messages</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
