<body>
  <div class="container">
    <div class="sidebar">
      <a href="#" class="active">Dashboard</a>
      <a href="/patient_list">Patients</a>
      <a href="/patients_report">Reports</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="main-content">
      <div class="header">
        <h1>NEUROLOGIST DASHBOARD</h1>
        <a href="/login" class="logout">Logout</a>
      </div>

      <div class="card-group">
        <div class="card">
          <h2>NEW PATIENTS</h2>
          <p>{{ new_patients }}</p>

        </div>
        <div class="card">
          <h2>UPCOMING APPOINTMENTS</h2>
          <p>{{ upcoming_appointments }}</p>
        </div>
        <div class="card">
          <h2>ALERTS</h2>
          <p>0</p>
        </div>
      </div>

      <div class="section flex-grid">
  <div class="table-container">
    <div class="section-title">PATIENT LIST</div>
    <table>
      <thead>
        <tr>
          <th>Full Name</th>
          <th>Age</th>
          <th>NIHSS Score</th>
          <th>Review Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for patient in patients %}
        <tr>
          <td>{{ patient.fullname }}</td>
          <td>{{ patient.age }}</td>
          <td>{{ patient.nhiss_score }}</td>
          <td>
            {% if patient.neuro_approved %}
              <span class="badge stable">Approved</span>
            {% else %}
              <span class="badge critical">Pending Review</span>
            {% endif %}
          </td>
          <td>
            <a href="{{ url_for('view_patient', patient_id=patient.id) }}">
              <button class="btn-view">View</button>
            </a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <!-- ✅ Upcoming Appointments Table -->
    <div class="section-title" style="margin-top: 30px;">UPCOMING APPOINTMENTS</div>
   
    <table>
      <thead>
        <tr>
          <th>Patient</th>
          <th>Date & Time</th>
          <th>Purpose</th>
        </tr>
      </thead>
      <tbody>
        {% for app in appointments %}
        <tr>
          <td>{{ app.patient.fullname }}</td>
          <td>{{ app.datetime }}</td>
          <td>{{ app.purpose }}</td>
        </tr>
        {% else %}
        <tr>
          <td colspan="3">No upcoming appointments scheduled.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <!-- End Appointments -->

    <a href="{{ url_for('schedule_appointment') }}" class="schedule-btn">+ Schedule Appointment</a>

  </div>

    // Automatically fade out flash messages after 3.5 seconds

        msg.style.transition = "opacity 0.6s ease";
        msg.style.opacity = '0';
        setTimeout(() => msg.remove(), 600); // remove from DOM after fade
      });
    }, 3500); // adjust duration as needed
  </script>
