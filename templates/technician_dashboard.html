<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Technician Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f7f9fc;
      color: #2c3e50;
    }

    /* --- NAVBAR --- */
    .navbar {
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 40px;
      border-bottom: 1px solid #e0e0e0;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 10px;
    }

    .brand-name {
      font-size: 1.5rem;
      font-weight: 600;
      color: #2c3e50;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      color: #2c3e50;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background-color: #f0f4f7;
      color: #005b96;
    }

    /* --- MAIN CONTENT --- */
    .main-wrapper {
      max-width: 1000px;
      margin: 40px auto;
      padding: 40px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    }

    h1 {
      margin-top: 0;
      color: #34495e;
    }

    .button {
      background-color: #4ca1af;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: #0056b3;
    }

    form {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    form input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
      border: 1px solid #e0e0e0;
    }

    th {
      background-color: #4ca1af;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f8f9fa;
    }

    tr:hover {
      background-color: #e0f7fa;
    }

    .reset-btn {
      background-color: #7f8c8d;
    }

    .reset-btn:hover {
      background-color: #636e72;
    }

    h2 {
      margin-top: 40px;
      color: #2c3e50;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="brand">
      <img src="{{ url_for('static', filename='images/strokesynclogo.png') }}" alt="Logo" />
      <span class="brand-name">StrokeSync</span>
    </div>
    <div class="nav-links">
      <a href="{{ url_for('technician_dashboard') }}" class="active">Dashboard</a>
      <a href="{{ url_for('patient_list') }}">Patients</a>
      <a href="/login">Logout</a>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-wrapper">
    <h1>DASHBOARD – STROKE TECHNICIAN</h1>

    <form action="/patient_data_entry" method="GET">
      <button type="submit" class="button">+ New Patient</button>
    </form>

    <form method="POST" action="{{ url_for('technician_dashboard') }}">
      <input type="text" name="search_query" placeholder="Search by name or age..." required>
      <button type="submit" class="button">Search</button>
      <a href="{{ url_for('technician_dashboard') }}" class="button reset-btn">Reset</a>
    </form>

    <h2>Active Patients</h2>

    <table>
      <thead>
        <tr>
          <th>Full Name</th>
          <th>Age</th>
          <th>Arrival</th>
        </tr>
      </thead>
      <tbody>
        {% for patient in all_patients %}
        <tr>
          <td>{{ patient.fullname }}</td>
          <td>{{ patient.age }}</td>
          <td>{{ patient.arrival }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

</body>
</html>
