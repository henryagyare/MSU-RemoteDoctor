<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technician Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f7f9fc; /* Softer light gray background */
      color: #2c3e50; /* Darker text color for readability */
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 220px;
      background-color: #34495e; /* Muted dark blue */
      padding: 20px;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
    }

    .sidebar a {
      display: block;
      margin-bottom: 15px;
      text-decoration: none;
      color: #ecf0f1; /* Light text color */
      font-weight: bold;
      padding: 10px;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background-color: #4ca1af; /* Highlighted link color */
      color: #fff;
    }

    .main-content {
      flex: 1;
      padding: 30px;
      background-color: #ffffff; /* White background for the main content */
      border-radius: 8px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
      margin: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logout {
      text-decoration: none;
      color: #e74c3c; /* Red for logout */
      font-weight: bold;
      transition: color 0.3s ease;
    }

    .logout:hover {
      color: #c0392b; /* Darker red on hover */
    }

    h1 {
      margin: 0;
      color: #34495e; /* Darker heading color */
    }

    .button {
      background-color: #4ca1af; /* Muted blue button */
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: #0056b3; /* Darker blue on hover */
    }

    form input[type="search"] {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
      margin-right: 10px;
    }

    form input[type="submit"] {
      background-color: #4ca1af;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    form input[type="submit"]:hover {
      background-color: #0056b3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #4ca1af; /* Muted blue for table headers */
      color: white;
      font-weight: bold;
    }

    tr:nth-child(even) {
      background-color: #f8f9fa; /* Light gray for alternating rows */
    }

    tr:hover {
      background-color: #e0f7fa; /* Highlight row on hover */
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <a href="#" class="active">Dashboard</a>
      <a href="/patient_list">Patients</a>
    </div>
    <div class="main-content">
      <div class="top-bar">
        <h1>DASHBOARD – STROKE TECHNICIAN</h1>
        <a href="#" class="logout">Log Out</a>
      </div>
      <form action='/patient_data_entry' method = 'GET'> 
        <button  type='submit' class="button">+ New Patient</button>
      </form> 
      <form action="/technician_dashboard" method="POST">
        <input type="search" name="search_patients">
        <input type="submit">
      </form>

      <h2>ACTIVE PATIENTS</h2>
      <table>
        <thead>
          <tr>
            <th>Patient ID</th>
            <th>Name</th>
            <th>Status</th>
            <th>Date of Arrival</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>12345</td>
            <td>Jane Doe</td>
            <td>In Progress</td>
            <td>04/01/2024</td>
          </tr>
          <tr>
            <td>67890</td>
            <td>John Smith</td>
            <td>In Progress</td>
            <td>04/01/2024</td>
          </tr>
          <tr>
            <td>13579</td>
            <td>Michael Brown</td>
            <td>In Progress</td>
            <td>03/31/2024</td>
          </tr>
          <tr>
            <td>24680</td>
            <td>Emily White</td>
            <td>In Progress</td>
            <td>03/30/2024</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
