<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Technician Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    .container {
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 200px;
      background-color: #e0e0e0;
      padding: 20px;
    }
    .sidebar a {
      display: block;
      margin-bottom: 10px;
      text-decoration: none;
      color: black;
      font-weight: bold;
    }
    .sidebar a.active {
      background-color: #ccc;
      padding: 5px;
      border-radius: 5px;
    }
    .main-content {
      flex: 1;
      padding: 40px;
      background-color: #fff;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logout {
      text-decoration: none;
      color: #0d3f8f;
      font-weight: bold;
    }
    .button {
      background-color: white;
      border: 1px solid black;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 20px;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table, th, td {
      border: 1px solid #aaa;
    }
    th, td {
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #ddd;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <a href="#" class="active">Dashboard</a>
      <a href="/patient_list">Patients</a>
    </div>
    <div class="main-content">
      <div class="top-bar">
        <h1>DASHBOARD – STROKE TECHNICIAN</h1>
        <a href="#" class="logout">Log Out</a>
      </div>
      <form action="/patient_data_entry" method="GET"> 
        <button type="submit" class="button">+ New Patient</button>
      </form>

      <!-- SEARCH BAR -->
<input type="text" id="searchName" placeholder="Search by name" />
<input type="date" id="searchDate" placeholder="Search by arrival date" />

<h2>ACTIVE PATIENTS</h2>
<table>
  <thead>
    <tr>
      <!-- <th>Patient ID</th> -->
      <th>Name</th>
      <th>Date of Arrival</th>
      <th>Status</th>

    </tr>
  </thead>
  <tbody id="patientBody">
    <!-- Filled by JS -->
  </tbody>
</table>

<script>
  function fetchAndRenderPatients() {
    const name = document.getElementById('searchName').value;
    const date = document.getElementById('searchDate').value;
    const url = `/api/search_patients?name=${encodeURIComponent(name)}&arrival=${encodeURIComponent(date)}`;

    fetch(url)
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById('patientBody');
        tbody.innerHTML = '';

        if (data.searched) {
          const row = document.createElement('tr');
          row.innerHTML = `<td>${data.searched.id}</td><td>${data.searched.fullname}</td><td>${data.searched.status}</td><td>${data.searched.arrival}</td>`;
          row.style.backgroundColor = "#e0ffe0";
          tbody.appendChild(row);
        }

        data.top_patients.forEach(p => {
          if (!data.searched || p.id !== data.searched.id) {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${p.id}</td><td>${p.fullname}</td><td>${p.status}</td><td>${p.arrival}</td>`;
            tbody.appendChild(row);
          }
        });
      });
  }

  document.getElementById('searchName').addEventListener('input', fetchAndRenderPatients);
  document.getElementById('searchDate').addEventListener('input', fetchAndRenderPatients);
  window.onload = fetchAndRenderPatients;
  window.addEventListener('focus', fetchAndRenderPatients);
</script>
    </div>
  </div>
</body>
</html>
