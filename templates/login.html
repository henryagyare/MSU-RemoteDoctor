<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body {
      font-family: 'Poppins', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #2c3e50, #4ca1af); /* Muted blue gradient */
      color: #f5f5f5; /* Softer text color */
    }

    .login-container {
      background-color: #34495e; /* Muted dark blue */
      padding: 40px 50px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-container h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #ecf0f1; /* Light text color */
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #bdc3c7; /* Softer label color */
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #7f8c8d; /* Muted border color */
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
      background-color: #2c3e50; /* Darker input background */
      color: #ecf0f1; /* Light text color */
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    select:focus {
      border-color: #4ca1af; /* Highlighted border color */
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #4ca1af, #2c3e50); /* Muted gradient */
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: linear-gradient(135deg, #2c3e50, #4ca1af); /* Reverse gradient on hover */
    }

    select {
      appearance: none;
      background: #34495e; /* Darker background for dropdown */
      cursor: pointer;
    }

    select:focus {
      outline: none;
    }

    form {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    
    <form method='POST' action='/login'>
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="form-group">
        <label for="role">Role:</label>
        <select id="role" name="role" required>
          <option value="">Select role</option>
          <option value="technician">Technician</option>
          <option value="neurologist">Neurologist</option>
        </select>
      </div>
      <button type="submit">Log In</button>
    </form>
 
  </div>
</body>
</html>
