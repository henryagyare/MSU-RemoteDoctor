<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StrokeSync | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-bg: #eaf4f8;
      --accent-blue: #005b96;
      --accent-light: #d6eaf8;
      --input-bg: #f0f4f8;
      --input-border: #cfd8dc;
      --text-color: #333;
      --btn-gradient: linear-gradient(135deg, #007acc, #005b96);
      --btn-hover: linear-gradient(135deg, #005b96, #007acc);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--primary-bg);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .brand img {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .brand-name {
      font-size: 2.2rem;
      font-weight: 600;
      color: var(--accent-blue);
    }

    .login-container {
      background-color: white;
      padding: 40px 35px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 1.8rem;
      color: var(--accent-blue);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      background-color: var(--input-bg);
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    input:focus,
    select:focus {
      border-color: var(--accent-blue);
      outline: none;
      box-shadow: 0 0 4px rgba(0, 91, 150, 0.2);
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      margin-top: 5px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--btn-gradient);
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s ease-in-out;
      margin-top: 10px;
    }

    button:hover {
      background: var(--btn-hover);
      transform: scale(1.02);
    }

    a {
      display: block;
      margin-top: 20px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--accent-blue);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .brand-name {
        font-size: 1.8rem;
      }

      .login-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="brand">
    <img src="{{ url_for('static', filename='images/strokesynclogo.png') }}" alt="StrokeSync Logo" />
    <div class="brand-name">StrokeSync</div>
  </div>

  <div class="login-container">
    <h2>Login</h2>
    <form method="POST" action="/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="pwd" name="password" required />
        <div class="checkbox">
          <input type="checkbox" onclick="showPwd()" id="show-password" />
          <label for="show-password">Show Password</label>
        </div>
      </div>
      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" name="role" required>
          <option value="">Select role</option>
          <option value="technician">Technician</option>
          <option value="neurologist">Neurologist</option>
          <option value="patient">Patient</option>
        </select>
      </div>
      <button type="submit">Log In</button>
    </form>
    <a href="create_account">Create New Account (Accounts Approved in 1–3 Business Days)</a>
  </div>

  <script>
    function showPwd() {
      const pwd = document.getElementById("pwd");
      pwd.type = pwd.type === "password" ? "text" : "password";
    }
  </script>

</body>
</html>
