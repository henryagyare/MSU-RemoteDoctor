<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Patient Data Entry</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #8e9eab, #eef2f3);
      color: #2c3e50;
    }

    /* Header Bar */
    .header-bar {
      display: flex;
      align-items: center;
      padding: 10px 30px;
      background-color: #ffffff;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
    }

    .header-bar img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
      margin-right: 10px;
    }

    .header-bar .brand-name {
      font-size: 1.5rem;
      font-weight: 600;
      color: #2c3e50;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin: 30px 0 20px;
    }

    form {
      max-width: 800px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .form-section {
      margin-bottom: 30px;
    }

    .form-section h3 {
      margin-bottom: 15px;
      color: #34495e;
      font-weight: bold;
      border-bottom: 2px solid #74b9ff;
      padding-bottom: 5px;
    }

    .form-group {
      display: flex;
      flex-wrap: nowrap;
      margin-bottom: 15px;
      align-items: center;
    }

    .form-group label {
      width: 180px;
      margin-right: 10px;
      font-weight: bold;
      color: #34495e;
      text-align: right;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      background-color: #f7f9fa;
      color: #2c3e50;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      font-style: italic;
      color: #7f8c8d;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #74b9ff;
      outline: none;
    }

    .inline-input {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .inline-input input {
      width: 100px;
    }

    .checkbox-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .checkbox-group label {
      background-color: #dfe6e9;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .checkbox-group label:hover {
      background-color: #b2bec3;
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #74b9ff;
      color: white;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0984e3;
    }

    button[type="reset"] {
      background-color: #e74c3c;
    }

    button[type="reset"]:hover {
      background-color: #c0392b;
    }

    textarea {
      resize: none;
    }

    .form-group input[type="file"] {
      padding: 5px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Header Bar -->
  <div class="header-bar">
    <img src="{{ url_for('static', filename='images/strokesynclogo.png') }}" alt="Logo" />
    <span class="brand-name">StrokeSync</span>
  </div>

  <h2>Patient Data Entry</h2>

  <form method="post" action="/nhiss_score" enctype="multipart/form-data">
    <div class="form-section">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="fullname" required />
      </div>
      <div class="form-group">
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required />
        <label for="sex">Sex:</label>
        <select id="sex" name="sex" required>
          <option value="">Select Sex</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="arrival">Arrival Date & Time:</label>
        <input type="datetime-local" id="arrival" name="arrival" required />
      </div>
      <div class="form-group">
        <label for="strokeTime">Stroke Onset Time:</label>
        <input type="datetime-local" id="strokeTime" name="stroke_time" />
      </div>
    </div>

    <div class="form-section">
      <h3>Vital Signs</h3>
      <div class="form-group">
        <label>Blood Pressure:</label>
        <div class="inline-input">
          <input type="text" placeholder="Systolic" name="systolic" required /> /
          <input type="text" placeholder="Diastolic" name="diastolic" required />
        </div>
      </div>
      <div class="form-group">
        <label for="heart-rate">Heart Rate (Bpm):</label>
        <input type="number" id="heart-rate" name="heart-rate" required />
      </div>
      <div class="form-group">
        <label for="rr">Respiratory Rate:</label>
        <input type="number" id="rr" name="respiratory-rate" required />
      </div>
      <div class="form-group">
        <label for="temp">Temperature (°C):</label>
        <input type="number" id="temp" name="temp" required />
      </div>
      <div class="form-group">
        <label for="spo2">Oxygen Saturation (%):</label>
        <input type="number" id="spo2" name="oxygen-saturation" required />
      </div>
      <div class="form-group">
        <label for="glucose">Blood Glucose Level (mg/dL):</label>
        <input type="number" id="glucose" name="glucose" required />
      </div>
    </div>

    <div class="form-section">
      <h3>Medical History</h3>
      <div class="checkbox-group">
        <label><input type="checkbox" name="medical-history" value="Hypertension" /> Hypertension</label>
        <label><input type="checkbox" name="medical-history" value="Diabetes" /> Diabetes</label>
        <label><input type="checkbox" name="medical-history" value="Atrial-Fibrillation" /> Atrial Fibrillation</label>
        <label>
          <input type="checkbox" id="showMedInput" onclick="toggleMedicationBox()" />
          Current Medications
        </label>
        <label><input type="checkbox" name="medical-history" value="Family-History-of-stroke" /> Family History of Stroke</label>
      </div>
      <div class="form-group hidden" id="medication-box">
        <label for="meds">Current Medications:</label>
        <input type="text" id="meds" name="meds" />
      </div>
      <div class="form-group">
        <label for="allergies">Allergies:</label>
        <input type="text" id="allergies" name="allergies" />
      </div>
      <div class="form-group">
        <label for="stroke">Previous Stroke Events:</label>
        <input type="text" id="stroke" name="previous-stroke-event" />
      </div>
    </div>

    <div class="form-section">
      <h3>Imaging</h3>
      <div class="form-group">
        <label for="ct">Upload CT Scan:</label>
        <input type="file" id="ct" name="CT-scan" />
      </div>
      <div class="form-group">
        <label for="imagingTime">Imaging Date & Time:</label>
        <input type="datetime-local" id="imagingTime" name="imaging-date-time" />
      </div>
      <div class="form-group">
        <label for="notes">Radiologist Notes:</label>
        <textarea id="notes" rows="4" name="radiologist-notes"></textarea>
      </div>
    </div>

    <div class="button-group">
      <button type="submit">Next</button>
      <button type="reset">Reset Form</button>
    </div>
  </form>

  <script>
    function toggleMedicationBox() {
      const box = document.getElementById('medication-box');
      box.classList.toggle('hidden');
    }
  </script>
</body>
</html>
