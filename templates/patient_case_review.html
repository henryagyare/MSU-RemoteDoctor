<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Review</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: #f5f5f5;
    }
    .container {
      display: flex;
    }
    .sidebar {
      width: 220px;
      background-color: #ddd;
      padding: 20px;
      min-height: 100vh;
    }
    .sidebar a {
      display: block;
      margin: 15px 0;
      text-decoration: none;
      color: #000;
      font-weight: bold;
    }
    .main {
      flex: 1;
      padding: 30px;
      background-color: #fff;
    }
    h1 {
      margin-top: 0;
    }
    .section {
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .row {
      display: flex;
      gap: 20px;
    }
    .column {
      flex: 1;
    }
    .exam-finding-box {
      border: 2px dashed #aaa;
      height: 180px;
      background-color: #f8f8f8;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #999;
      margin-bottom: 10px;
    }
    .submit-button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .submit-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="sidebar">
      <a href="#">Dashboard</a>
      <a href="#">Cases</a>
      <a href="#">Reports</a>
    </div>
    <div class="main">
      <h1>Case Review</h1>

      <div class="section">
        <h3>Patient Information</h3>
        <div class="row">
          <div class="column">
            <label for="name">Name:</label>
            <input type="text" id="name">
          </div>
          <div class="column">
            <label for="age">Age:</label>
            <input type="number" id="age">
          </div>
          <div class="column">
            <label for="mrn">NIHSS:</label> <!-- National Institute of Health Stroke Scale-->
            <input type="text" id="nihss">
          </div>
        </div>
      </div>

      <div class="section">
        <h3>Symptoms</h3>
        <textarea rows="3" placeholder="Describe symptoms..."></textarea>
      </div>

      <div class="section row">
        <div class="column">
          <h3>Patient CT Scan</h3>
          <div class="exam-finding-box">Imaging/Findings Placeholder</div>
          <label for="diagnosis">Diagnosis:</label>
          <textarea rows="3" id="diagnosis" placeholder="Enter diagnosis details..."></textarea>
        </div>
        <div class="column">
          <h3>Diagnostic and Treatment</h3>
          <label for="treatment">Treatment Plan:</label>
          <textarea rows="6" id="treatment" placeholder="Enter treatment plan..."></textarea>
        </div>
      </div>

      <div class="section">
        <h3>Disposition</h3>
        <textarea rows="3" placeholder="Enter patient disposition..."></textarea>
      </div>

      <button class="submit-button">Submit</button>
    </div>
  </div>
</body>
</html>
