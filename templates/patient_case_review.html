<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Review</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #2c3e50, #4ca1af); /* Muted blue gradient */
      color: #f5f5f5; /* Softer text color */
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background-color: #34495e; /* Muted dark blue */
      padding: 20px;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.2);
    }

    .sidebar a {
      display: block;
      margin: 15px 0;
      text-decoration: none;
      color: #ecf0f1; /* Light text color */
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background-color: #4ca1af; /* Highlighted link color */
      color: #fff;
    }

    .main {
      flex: 1;
      padding: 30px;
      background-color: #ffffff; /* White background for the main content */
      border-radius: 8px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
      margin: 20px;
    }

    h1 {
      margin-top: 0;
      color: #34495e; /* Darker heading color */
    }

    .section h3 {
      color: #2c3e50; /* Darker color for section titles */
      font-weight: bold;
      margin-bottom: 10px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #34495e;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
      background-color: #f8f9fa; /* Light gray background for inputs */
      color: #34495e;
    }

    input[type="text"]::placeholder,
    input[type="number"]::placeholder,
    textarea::placeholder {
      font-style: italic;
      color: #7f8c8d; /* Softer placeholder color */
      font-family: 'Arial', sans-serif; /* Change placeholder font */
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    textarea:focus {
      border-color: #4ca1af; /* Highlighted border color */
      outline: none;
    }

    .row {
      display: flex;
      gap: 20px;
    }

    .column {
      flex: 1;
    }

    .exam-finding-box {
      border: 2px dashed #aaa;
      height: 180px;
      background-color: #f8f8f8;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #999;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .submit-button {
      background-color: #4ca1af;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .submit-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="sidebar">
      <a href="#">Dashboard</a>
      <a href="#">Cases</a>
      <a href="#">Reports</a>
    </div>
    <div class="main">
      <h1>Case Review</h1>

      <div class="section">
        <h3>Patient Information</h3>
        <div class="row">
          <div class="column">
            <label for="name">Name:</label>
            <input type="text" id="name">
          </div>
          <div class="column">
            <label for="age">Age:</label>
            <input type="number" id="age">
          </div>
          <div class="column">
            <label for="mrn">NIHSS:</label> <!-- National Institute of Health Stroke Scale-->
            <input type="text" id="nihss">
          </div>
        </div>
      </div>

      <div class="section">
        <h3>Symptoms</h3>
        <textarea rows="3" placeholder="Describe symptoms..."></textarea>
      </div>

      <div class="section row">
        <div class="column">
          <h3>Patient CT Scan</h3>
          <div class="exam-finding-box">Imaging/Findings Placeholder</div>
          <label for="diagnosis">Diagnosis:</label>
          <textarea rows="3" id="diagnosis" placeholder="Enter diagnosis details..."></textarea>
        </div>
        <div class="column">
          <h3>Diagnostic and Treatment</h3>
          <label for="treatment">Treatment Plan:</label>
          <textarea rows="6" id="treatment" placeholder="Enter treatment plan..."></textarea>
        </div>
      </div>

      <div class="section">
        <h3>Disposition</h3>
        <textarea rows="3" placeholder="Enter patient disposition..."></textarea>
      </div>

      <button class="submit-button">Submit</button>
    </div>
  </div>
</body>
</html>
